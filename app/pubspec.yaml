name: smart_landmarks
description: "CSE 489 Lab Exam - Smart Geo-Tagged Landmarks (Flutter)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # --- Networking ---
  http: ^1.2.1                 

  # --- State management (kept simple: Provider = ChangeNotifier + Consumer) ---
  provider: ^6.1.2

  # --- Local database (offline cache + offline visit queue + pending job tracking) ---
  sqflite: ^2.3.3
  path: ^1.9.0

  # --- Map (OpenStreetMap, no API key / billing account needed) ---
  flutter_map: ^6.2.1
  latlong2: ^0.9.1

  # --- Location ---
  geolocator: ^12.0.0

  # --- Image picking for Add Landmark (camera or gallery) ---
  image_picker: ^1.1.2

  # --- Background work: required by the exam spec instead of a manual Timer/Thread loop ---
  workmanager: ^0.5.2

  # --- Detecting online/offline so we know when to sync the queue ---
  connectivity_plus: ^6.0.5

  # --- Small local key/value store (last sync time, first-run flags) ---
  shared_preferences: ^2.2.3

  # --- Formatting visit timestamps in the Activity screen ---
  intl: ^0.19.0

  # --- Unique local ids for queued offline visits before they get a server job_id ---
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
